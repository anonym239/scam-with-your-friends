name: Build APK

# Baut bei jedem Push die Android-App KotlanaOS.apk und hängt sie an das Release
# zum selben Commit an (das die .exe-Workflow erstellt). Zusätzlich als Artifact.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Spiel-Dateien ins Android-Projekt kopieren
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -r public/. android/app/src/main/assets/web/
          # leere Platzhalterdatei entfernen, falls vorhanden
          rm -f android/app/src/main/assets/web/.gitkeep
          # Versionsinfo einbacken (fuer die Update-Pruefung)
          echo "{\"commit\":\"${{ github.sha }}\",\"built\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > android/app/src/main/assets/web/version.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK bauen
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KotlanaOS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KotlanaOS-apk
          path: KotlanaOS.apk

      - name: An Release zum selben Commit anhängen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA='${{ github.sha }}'
          TAG=""
          for i in $(seq 1 40); do
            TAG=$(gh api "repos/${{ github.repository }}/releases" --jq "[.[] | select(.target_commitish==\"$SHA\")][0].tag_name" 2>/dev/null || true)
            if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then break; fi
            echo "Warte auf das Release zum Commit…"; sleep 20
          done
          if [ -n "$TAG" ] && [ "$TAG" != "null" ]; then
            gh release upload "$TAG" KotlanaOS.apk --clobber
            echo "APK an Release $TAG angehängt."
          else
            echo "Kein passendes Release gefunden – APK ist nur als Workflow-Artifact verfügbar."
          fi
