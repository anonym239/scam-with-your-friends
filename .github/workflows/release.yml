name: Build .exe & Release

# Bei jedem Push wird KotlanaOS.exe gebaut und als neues GitHub-Release veröffentlicht.
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: KotlanaOS.exe bauen
        run: npm run build:exe

      - name: Kurztest der .exe
        shell: bash
        run: |
          KOTLANA_NO_BROWSER=1 PORT=3123 ./dist/KotlanaOS.exe &
          sleep 5
          curl -sf http://localhost:3123/ | grep -q "Kotlana OS"
          curl -sf -o /dev/null http://localhost:3123/js/main.js
          taskkill //F //IM KotlanaOS.exe || true

      - name: Version bestimmen
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Setup bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" build\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup testen (stille Installation + Start + Deinstallation)
        shell: pwsh
        run: |
          Start-Process dist\KotlanaOS-Setup.exe -ArgumentList '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "$env:LOCALAPPDATA\Programs\Kotlana OS\KotlanaOS.exe"
          if (-not (Test-Path $exe)) { throw "KotlanaOS.exe wurde nicht installiert" }
          $env:KOTLANA_NO_BROWSER = '1'; $env:PORT = '3124'
          $p = Start-Process $exe -PassThru
          Start-Sleep 5
          $html = (Invoke-WebRequest http://localhost:3124/ -UseBasicParsing).Content
          if ($html -notmatch 'Kotlana OS') { throw 'Installierte .exe liefert das Spiel nicht aus' }
          Stop-Process $p -Force
          Start-Process "$env:LOCALAPPDATA\Programs\Kotlana OS\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Write-Host 'Setup-Test ok'

      - uses: actions/upload-artifact@v4
        with:
          name: KotlanaOS-windows
          path: |
            dist/KotlanaOS-Setup.exe
            dist/KotlanaOS.exe

      - name: GitHub-Release erstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          cat > notes.md <<NOTES
          ## Kotlana OS ${TAG}

          ### Download
          - **\`KotlanaOS-Setup.exe\`** (empfohlen): installiert Kotlana OS mit Startmenü- und Desktop-Verknüpfung und Deinstallation. Keine Administratorrechte nötig.
          - \`KotlanaOS.exe\`: portable Version, einfach doppelklicken.

          Nach dem Start öffnet sich der Browser mit dem Spiel. Das schwarze Fenster offen lassen, solange du spielst (schließen = Spiel beenden).

          - Für KI-Anrufer/KI-Spieler: [Ollama](https://ollama.com) starten und ein Modell laden, z. B. \`ollama pull llama3.2\`
          - Ohne Ollama: in der Demo-App auf „Demo starten“ klicken
          - Windows SmartScreen warnt evtl., weil die Datei nicht signiert ist → „Weitere Informationen“ → „Trotzdem ausführen“

          Commit: ${{ github.sha }} (Branch \`${{ github.ref_name }}\`)
          NOTES
          gh release create "$TAG" dist/KotlanaOS-Setup.exe dist/KotlanaOS.exe \
            --target "${{ github.sha }}" \
            --title "Kotlana OS ${TAG}" \
            --notes-file notes.md \
            --latest
